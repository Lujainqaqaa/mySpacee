<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySpace | Designer Profile</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="nav-shared.css">
</head>
<body>
  <!-- Main navigation -->
  <header class="topbar">
    <a class="brand" href="myhome.html" aria-label="MySpace home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2C6.5 2 3 7 3 12c0 2.8 1.2 5.3 3.1 7 .8-3.5 3.5-6.5 7.4-7.5C10.6 13 9 15 9 17.5c0 3 2 5.3 4.8 5.5C17.5 23.1 21 18.5 21 13c0-6-4-11-9-11Z" />
      </svg>
      <span>MySpace</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="myhome.html">My Home</a>
      <a href="ai.html">AI Design</a>
      <a class="active" href="desinger.html">Designers</a>
      <a href="shop.html">Reuse Furniture</a>
      <a href="myprojects.html">My Projects</a>
    </nav>
    <div class="nav-actions">
      <button class="message-button" aria-label="Messages" title="Messages">▱</button>
      <button class="avatar" id="avatarButton" aria-label="User profile">U</button>
      <button class="logout" id="logoutButton">Logout</button>
    </div>
  </header>

  <main class="page dynamic-provider-page" id="dynamicProviderPage">
    <section class="profile-hero">
      <div class="hero-cover"></div>
      <div class="profile-summary">
        <img class="dynamic-provider-photo" id="providerPhoto" alt="Designer portrait">
        <div class="profile-info"><p class="eyebrow">PROFESSIONAL PROFILE</p><h1 id="providerName">Designer</h1><p class="role" id="providerRole"></p><div class="profile-meta" id="providerMeta"></div><p id="providerBio"></p></div>
        <div class="hero-actions"><button class="button button-outline" id="chatButton">Message</button><button class="button button-primary" id="requestButton">Request a Service</button></div>
      </div>
    </section>
    <div class="profile-layout">
      <div class="main-column">
        <section class="panel"><h2>About</h2><p id="providerAbout"></p><div class="tags" id="providerTags"></div></section>
        <section class="panel"><h2>Services &amp; Pricing</h2><div id="providerServices" class="dynamic-services"></div></section>
        <section class="panel"><h2>Portfolio</h2><div id="providerPortfolio" class="portfolio-grid dynamic-portfolio"></div></section>
        <section class="panel"><h2>Client Reviews</h2><div id="providerReviews" class="dynamic-reviews"></div></section>
      </div>
      <aside class="side-column">
        <section class="panel"><h2>Professional Details</h2><div id="providerDetails"></div></section>
        <section class="panel"><h2>Availability</h2><div class="info-row"><span>Next Available</span><strong id="providerNext"></strong></div><div class="info-row"><span>Response Time</span><strong id="providerResponse"></strong></div><div class="info-row"><span>Active Projects</span><strong id="providerActive"></strong></div></section>
      </aside>
    </div>
  </main>


  <!-- Modal for chat, service request, and portfolio image preview -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close dialog">×</button>
      <h2 id="modalTitle">Layla Hassan</h2>
      <div id="modalContent"></div>
      <button class="button button-primary modal-ok" id="modalOk">Close</button>
    </section>
  </div>
  <script src="platform-data.js"></script><script src="auth-guard.js"></script>
  <script src="app-links.js"></script>
  <script src="profile.js"></script>
</body>
</html>
