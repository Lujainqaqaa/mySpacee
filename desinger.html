<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySpace | Designers & Service Providers</title>
  <link rel="stylesheet" href="desinger.css">
  <link rel="stylesheet" href="nav-shared.css">
</head>
<body>
  <!-- Main navigation -->
  <header class="topbar">
    <a class="brand" href="myhome.html" aria-label="MySpace home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2C6.5 2 3 7 3 12c0 2.8 1.2 5.3 3.1 7 .8-3.5 3.5-6.5 7.4-7.5C10.6 13 9 15 9 17.5c0 3 2 5.3 4.8 5.5C17.5 23.1 21 18.5 21 13c0-6-4-11-9-11Z" />
      </svg>
      <span>MySpace</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="myhome.html">My Home</a>
      <a href="ai.html">AI Design</a>
      <a class="active" href="desinger.html">Designers</a>
      <a href="shop.html">Reuse Furniture</a>
      <a href="myprojects.html">My Projects</a>
    </nav>
    <div class="nav-actions">
      <button class="message-button" aria-label="Messages" title="Messages">▱</button>
      <button class="avatar" id="avatarButton" aria-label="User profile">U</button>
      <button class="logout" id="logoutButton">Logout</button>
    </div>
  </header>

  <main class="page">
    <!-- Page title -->
    <section class="page-heading">
      <p class="eyebrow">MARKETPLACE</p>
      <h1>Designers &amp; Service Providers</h1>
      <p class="subtitle">Find verified professionals to bring your vision to life.</p>
    </section>

    <!-- Search and sort controls -->
    <section class="search-row" aria-label="Search providers">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search providers..." autocomplete="off"></label>
      <select id="sortSelect" aria-label="Sort providers">
        <option value="rating">Rating</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </section>

    <!-- Category filters -->
    <nav class="category-list" aria-label="Provider categories">
      <button class="category active" data-category="All">All</button>
      <button class="category" data-category="Interior Designers">Interior Designers</button>
      <button class="category" data-category="Furniture Makers">Furniture Makers</button>
      <button class="category" data-category="Curtains">Curtains</button>
      <button class="category" data-category="Lighting">Lighting</button>
      <button class="category" data-category="Carpentry">Carpentry</button>
      <button class="category" data-category="Decoration">Decoration</button>
    </nav>

    <!-- Provider cards are rendered by script.js -->
    <section id="providerGrid" class="provider-grid" aria-label="Designers and service providers"></section>
    <p class="empty-state" id="emptyState" hidden>No providers match your search. Try another name or category.</p>
  </main>

  <!-- Simple modal used by View Profile and Contact -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close dialog">×</button>
      <h2 id="modalTitle">Provider details</h2>
      <div id="modalContent"></div>
      <button class="button button-primary modal-ok" id="modalOk">Close</button>
    </section>
  </div>
  <script src="platform-data.js"></script><script src="auth-guard.js"></script>
  <script src="app-links.js"></script>
  <script src="desinger.js"></script>
</body>
</html>
